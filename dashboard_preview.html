function TplEditor(props) {

  var _b = useState(tpl?tpl.body:"");        var body=_b[0]; var setBody=_b[1];

  var allText = body+subj;
  var matches = allText.match(/\{\{(\w+)\}\}/g)||[];
  var detectedVars = matches.filter(function(v,i,arr){ return arr.indexOf(v)===i; }).map(function(v){ return v.replace(/[{}]/g,""); });

  function insertVar(v) { setBody(function(b){ return b+"{{"+v+"}}"; }); }
  function doSave() {
    if (!name.trim()||!body.trim()) return;
    onSave({ id:tpl?tpl.id:("t_"+Date.now()), name:name.trim(), tag:tag, subject:subj, body:body, variables:detectedVars, sentCount:tpl?tpl.sentCount:0, replyRate:tpl?tpl.replyRate:0, createdAt:tpl?tpl.createdAt:new Date().toISOString().slice(0,10) });

          <input className="finput" value={subj} onChange={function(e){setSubj(e.target.value);}} placeholder="e.g. Quick question for {{business_name}}"/>
        </div>
        <div className="field">
          <label className="flabel" style={{ display:"flex", justifyContent:"space-between" }}>
            <span>Message Body</span>
            <span className="t3 small" style={{ fontWeight:400, textTransform:"none" }}>{"Use {{variable}} for personalisation"}</span>
          </label>
          <textarea className="finput" value={body} onChange={function(e){setBody(e.target.value);}} rows={7} style={{ resize:"vertical", fontFamily:"inherit", lineHeight:1.6 }} placeholder={"Hi {{name}},\n\nI noticed {{business_name}} doesn't have a website…"}/>

            })}
          </div>
        </div>
        {detectedVars.length>0 && (
          <div style={{ display:"flex", gap:5, flexWrap:"wrap", padding:"8px 12px", background:"#fffbeb", borderRadius:8, border:"1px solid #fde68a" }}>
            <span style={{ fontSize:".71rem", color:"#92400e", fontWeight:600, marginRight:4 }}>Detected:</span>
            {detectedVars.map(function(v){ return <VarPill key={v} v={v}/>; })}
          </div>
        )}
        <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
          <button className="btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn-primary" onClick={doSave} disabled={!name.trim()||!body.trim()}>
            <Ic k="save" size={14}/>{isNew?"Create Template":"Save Changes"}

    </Modal>
  );

                  <div style={{ fontSize:".77rem", color:"var(--t2)", lineHeight:1.55, display:"-webkit-box", WebkitLineClamp:3, WebkitBoxOrient:"vertical", overflow:"hidden", background:"var(--bg)", padding:"10px 12px", borderRadius:8, border:"1px solid var(--bs)", fontStyle:"italic", marginBottom:8 }}>{tpl.body}</div>
                  {tpl.variables.length>0 && (
                    <div style={{ display:"flex", gap:4, flexWrap:"wrap", marginBottom:8 }}>
                      {tpl.variables.map(function(v){ return <VarPill key={v} v={v}/>; })}
                    </div>
                  )}
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", paddingTop:8, borderTop:"1px solid var(--bs)" }}>
                    <div style={{ display:"flex", gap:12 }}>
                      <span style={{ display:"inline-flex", alignItems:"center", gap:4, fontSize:".71rem", color:"var(--t3)", fontWeight:600 }}><Ic k="send" size={11}/>{fmt(tpl.sentCount)} sent</span>
                      <span style={{ display:"inline-flex", alignItems:"center", gap:4, fontSize:".71rem", fontWeight:600, color:tpl.replyRate>20?"#22c55e":"var(--t3)" }}><Ic k="trending" size={11}/>{tpl.replyRate}% replies</span>
                    </div>
                    <span className="t3 small mono">{tpl.createdAt}</span>
                  </div>
                </div>
              );
            })}
          </div>
      }

      <div style={{ background:"var(--surface)", border:"1.5px solid var(--border)", borderRadius:"var(--r)", padding:"18px 20px", boxShadow:"var(--sh)", marginTop:8 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
          <Ic k="info" size={15} style={{color:"var(--indigo)"}}/>
          <span style={{ fontWeight:700, fontSize:".82rem" }}>Available Variables</span>
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
          {[["name","Contact name"],["business_name","Business name"],["category","Business type"],["sender_name","Your name"],["city","Lead city"],["phone","Phone number"]].map(function(pair){
            return (
              <div key={pair[0]} style={{ display:"flex", flexDirection:"column", gap:3 }}>
                <VarPill v={pair[0]}/>
                <span style={{ fontSize:".65rem", color:"var(--t3)", paddingLeft:2 }}>{pair[1]}</span>
              </div>
            );
          })}
        </div>
      </div>

      {(showNew||editing) && <TplEditor tpl={editing} onClose={function(){setShowNew(false);setEditing(null);}} onSave={doSave}/>}
      {previewing && <TplPreview tpl={previewing} onClose={function(){setPreviewing(null);}}/>}
    </div>
  );
}

/* ══════════════════════════════
   ROOT
══════════════════════════════ */
var TABS = [
  { key:"dashboard",  label:"Dashboard",    icon:"bar"  },
  { key:"categories", label:"Categories",   icon:"grid" },
  { key:"templates",  label:"DM Templates", icon:"msg"  },
];

function App() {
  var _tab = useState("dashboard");  var tab=_tab[0]; var setTab=_tab[1];
  var _run = useState(false);        var running=_run[0]; var setRunning=_run[1];
  var _bl  = useState(false);        var botLoading=_bl[0]; var setBotLoading=_bl[1];
  var _ac  = useState("");           var activeCity=_ac[0]; var setActiveCity=_ac[1];
  var _cfg = useState({ apiKey:"AIzaSy••••zXYZ", sheetId:"1BxiMVs8BtRS", dailyLimit:30 });
  var config=_cfg[0]; var setConfig=_cfg[1];
  var _tm  = useState(null);         var toastMsg=_tm[0]; var setToastMsg=_tm[1];

  function toast(msg){ setToastMsg(null); setTimeout(function(){setToastMsg(msg);},10); }
  function handleBotToggle() {
    setBotLoading(true);
    setTimeout(function(){
      setRunning(function(r){return !r;});
      setBotLoading(false);
      toast(running?"Bot stopped.":"Bot started!");
    }, 900);
  }

  return (
    <div className="app">
      <style>{CSS}</style>

      <header className="app-hdr">
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div className="brand-icon"><Ic k="activity" size={18} sw={2.5}/></div>
          <div>
            <div className="brand-name">LeadRadar</div>
            <div className="brand-sub">Local Business Intelligence</div>
          </div>
        </div>
        <nav className="tab-nav">
          {TABS.map(function(t){
            return (
              <button key={t.key} onClick={function(){setTab(t.key);}} className={"tab-btn "+(tab===t.key?"tab-active":"")}>
                <Ic k={t.icon} size={14}/><span>{t.label}</span>
              </button>
            );
          })}
        </nav>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span className="ref-hint"><Ic k="clock" size={11}/>{new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</span>
          <BotControl running={running} onToggle={handleBotToggle} loading={botLoading}/>
        </div>
      </header>

      <main style={{ paddingTop:4 }}>
        {tab==="dashboard"  && <DashboardTab running={running} onToggle={handleBotToggle} activeCity={activeCity} onCitySwitch={setActiveCity} config={config} onConfigSave={function(c){setConfig(function(p){return Object.assign({},p,c);});}}/>}
        {tab==="categories" && <CategoriesTab toast={toast}/>}
        {tab==="templates"  && <TemplatesTab  toast={toast}/>}
      </main>

      <footer style={{ marginTop:40, paddingTop:18, borderTop:"1px solid var(--border)", fontSize:".7rem", color:"var(--t3)", textAlign:"center", fontWeight:500 }}>
        LeadRadar v2 &nbsp;·&nbsp; FastAPI + Google Places API (New) &nbsp;·&nbsp; {running?"🟢 Bot running":"⚪ Bot idle"}
      </footer>

      {toastMsg && <Toast msg={toastMsg} onDone={function(){setToastMsg(null);}}/>}
    </div>
  );
}

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F7FA;--surface:#fff;--border:#E4E9F0;--bs:#EEF2F7;
  --t1:#0D1B2A;--t2:#4A5568;--t3:#9AA5B4;
  --indigo:#5B67F8;--indigo-lt:#EEF0FE;
  --amber:#F59E0B;--r:14px;
  --sh:0 1px 3px rgba(13,27,42,.05),0 1px 2px rgba(13,27,42,.04);
  --sh-md:0 4px 20px rgba(13,27,42,.08),0 1px 4px rgba(13,27,42,.04);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--t1);
}
body{background:var(--bg);min-height:100vh}
.mono{font-family:'JetBrains Mono',monospace}.small{font-size:.78rem}.t3{color:var(--t3)}
.app{max-width:1440px;margin:0 auto;padding:0 28px 52px}
.app-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding:18px 0 0;border-bottom:1px solid var(--border);margin-bottom:28px}
.brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#5B67F8,#818cf8);display:grid;place-items:center;color:#fff;box-shadow:0 3px 10px rgba(91,103,248,.35);flex-shrink:0}
.brand-name{font-size:1.1rem;font-weight:800;letter-spacing:-.025em}.brand-sub{font-size:.68rem;color:var(--t3);font-weight:500}
.ref-hint{display:flex;align-items:center;gap:4px;color:var(--t3);font-size:.72rem}
.tab-nav{display:flex;gap:2px;background:var(--bs);padding:4px;border-radius:11px;flex-shrink:0}
.tab-btn{display:flex;align-items:center;gap:6px;padding:6px 16px;border-radius:8px;font-size:.79rem;font-weight:600;font-family:inherit;cursor:pointer;border:none;background:transparent;color:var(--t3);transition:all .18s}
.tab-btn:hover{color:var(--t1)}.tab-active{background:var(--surface)!important;color:var(--t1)!important;box-shadow:var(--sh)}
.bot-btn{display:flex;align-items:center;gap:8px;padding:8px 18px;border-radius:10px;font-size:.82rem;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all .2s;letter-spacing:.01em}
.bot-start{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;box-shadow:0 2px 10px rgba(34,197,94,.28)}
.bot-start:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(34,197,94,.38)}
.bot-stop{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 2px 10px rgba(239,68,68,.28)}
.bot-btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.panel-hdr{display:flex;align-items:center;gap:8px;padding:15px 20px;border-bottom:1px solid var(--bs);font-weight:700;color:var(--t2);font-size:.82rem}
.panel-hdr h2{font-size:.85rem;font-weight:700;color:var(--t1)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.stats-row{grid-template-columns:1fr}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--sh);position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s}
.stat-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.stat-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent);border-radius:var(--r) var(--r) 0 0}
.stat-card__icon{width:36px;height:36px;border-radius:9px;flex-shrink:0;background:color-mix(in srgb,var(--accent) 13%,white);color:var(--accent);display:grid;place-items:center}
.stat-label{font-size:.69rem;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat-value{font-size:1.3rem;font-weight:800;margin-top:3px;font-family:'JetBrains Mono',monospace;letter-spacing:-.02em;color:var(--t1)}
.stat-sub{font-size:.71rem;color:var(--t3);margin-top:3px}
.main-grid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media(max-width:1024px){.main-grid{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px}
.prog-track{height:7px;background:var(--bs);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#5B67F8,#818cf8);transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(91,103,248,.35)}
.api-stat{display:flex;align-items:center;gap:7px;padding:10px 20px 14px;font-size:.78rem;color:var(--t2);font-weight:600;border-top:1px solid var(--bs)}
.field{display:flex;flex-direction:column;gap:5px}
.flabel{font-size:.7rem;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
.finput{padding:8px 12px;border-radius:9px;border:1.5px solid var(--border);font-size:.82rem;background:var(--bg);color:var(--t1);font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.finput:focus{border-color:var(--indigo);box-shadow:0 0 0 3px rgba(91,103,248,.13)}
select.finput{cursor:pointer}
.fslider{width:100%;accent-color:var(--indigo);cursor:pointer;margin-top:2px}
.badge-i{font-family:'JetBrains Mono',monospace;background:var(--indigo-lt);color:var(--indigo);padding:1px 8px;border-radius:6px;font-size:.78rem;font-weight:700}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 16px;border-radius:9px;background:var(--indigo);color:#fff;font-size:.8rem;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(91,103,248,.28);white-space:nowrap}
.btn-primary:hover:not(:disabled){background:#4a56e0;transform:translateY(-1px)}.btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:9px;background:transparent;color:var(--t2);font-size:.8rem;font-weight:600;font-family:inherit;border:1.5px solid var(--border);cursor:pointer;transition:all .15s}
.btn-ghost:hover{background:var(--bg);border-color:#cbd5e1}
.icon-sq{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--t3);cursor:pointer;display:grid;place-items:center;transition:all .15s;flex-shrink:0}
.icon-sq:hover{border-color:#cbd5e1;color:var(--t2)}
.icon-sq-sm{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:var(--bg);color:var(--t3);cursor:pointer;display:grid;place-items:center;transition:all .15s;flex-shrink:0}
.icon-sq-sm:hover{border-color:#cbd5e1;color:var(--t2)}.icon-sq-sm.dang:hover{border-color:#fca5a5;color:#ef4444;background:#fff5f5}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:99px;border:1.5px solid var(--border);background:var(--bg);color:var(--t2);font-size:.74rem;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-lt)}
.chip-active{background:var(--indigo)!important;color:#fff!important;border-color:var(--indigo)!important;box-shadow:0 2px 8px rgba(91,103,248,.28)}
.search-box{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:9px;border:1.5px solid var(--border);background:var(--surface);color:var(--t3)}
.search-input{border:none;background:transparent;outline:none;font-size:.78rem;color:var(--t1);font-family:inherit;width:130px}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl thead tr{border-bottom:1px solid var(--border)}
.tbl th{padding:9px 16px;text-align:left;font-size:.67rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);white-space:nowrap;background:var(--bg)}
.tbl th span{display:flex;align-items:center;gap:5px}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--bs)}
.tbl tbody tr:last-child td{border-bottom:none}.tbl tbody tr:hover{background:#fafbfd}
.trow{animation:rowIn .22s ease both}@keyframes rowIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.name-cell{font-weight:600;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.cat-tag{display:inline-flex;padding:2px 9px;border-radius:6px;background:#EFF9FF;color:#0369a1;font-size:.7rem;font-weight:700}
.status-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;background:#EDFBF3;color:#15803d;font-size:.7rem;font-weight:700}
.tbl-empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;color:var(--t3);font-size:.82rem}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--bs);font-size:.76rem}
.pag-btn{min-width:30px;height:30px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);color:var(--t2);cursor:pointer;font-size:.76rem;display:grid;place-items:center;font-family:inherit;font-weight:600;transition:all .15s}
.pag-btn:hover:not(:disabled){border-color:var(--indigo);color:var(--indigo)}.pag-active{background:var(--indigo);color:#fff!important;border-color:var(--indigo)!important}
.pag-btn:disabled{opacity:.35;cursor:not-allowed}
.section-topbar{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
.sec-title{font-size:1.1rem;font-weight:800;color:var(--t1);letter-spacing:-.02em}.sec-sub{font-size:.76rem;color:var(--t3);margin-top:3px;font-weight:500}
.cat-stats-bar{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh);padding:14px 24px;margin-bottom:20px;flex-wrap:wrap;gap:4px}
.cs-item{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;min-width:80px}
.cs-num{font-size:1.4rem;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--t1)}
.cs-div{width:1px;height:32px;background:var(--border);flex-shrink:0;margin:0 8px}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.cat-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:box-shadow .2s,transform .2s,opacity .2s}
.cat-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}.cat-off{opacity:.55}
.tog-btn{width:36px;height:20px;border-radius:99px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;padding:0;margin-left:auto}
.tog-on{background:#22c55e}.tog-off{background:#cbd5e1}
.tog-knob{position:absolute;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.tog-on .tog-knob{left:18px}.tog-off .tog-knob{left:2px}
.cat-add-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:transparent;border:2px dashed var(--border);border-radius:var(--r);padding:24px;cursor:pointer;color:var(--t3);font-size:.82rem;font-weight:600;font-family:inherit;transition:all .2s;min-height:130px}
.cat-add-tile:hover{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-lt)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px;margin-bottom:24px}
.tpl-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);transition:box-shadow .2s,transform .2s}
.tpl-card:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.modal-backdrop{position:fixed;inset:0;background:rgba(13,27,42,.45);display:grid;place-items:center;z-index:1000;padding:20px;backdrop-filter:blur(3px);animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(13,27,42,.18);width:100%;max-width:540px;animation:slideUp .2s ease;max-height:90vh;overflow-y:auto}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 14px;border-bottom:1px solid var(--border)}
.modal-header h3{font-size:.95rem;font-weight:800;color:var(--t1)}
.modal-close{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--bg);cursor:pointer;display:grid;place-items:center;color:var(--t3);transition:all .15s}
.modal-close:hover{background:var(--border);color:var(--t1)}.modal-body{padding:20px 22px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--t1);color:#fff;padding:10px 18px;border-radius:11px;font-size:.8rem;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(13,27,42,.22);animation:toastIn .22s ease;z-index:2000}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes ping{75%,100%{transform:scale(2.2);opacity:0}}
.spin{animation:spinK .7s linear infinite}@keyframes spinK{to{transform:rotate(360deg)}}
@media(max-width:680px){.app{padding:0 14px 40px}.tab-btn span{display:none}.stat-value{font-size:1.1rem}.tpl-grid{grid-template-columns:1fr}.cat-grid{grid-template-columns:1fr 1fr}}
`;

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
