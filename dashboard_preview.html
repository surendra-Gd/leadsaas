/* ═══════════════════════════════════════════════════════════
   API LAYER  — all server calls go through here
   Change API_BASE to point at your FastAPI server.
═══════════════════════════════════════════════════════════ */
const API_BASE = "http://localhost:8000";

async function api(method, path, body) {
  const opts = {
    method,
    headers: { "Content-Type": "application/json" },
  };
  if (body !== undefined) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(API_BASE + path, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      throw new Error(err.detail || `HTTP ${res.status}`);
    }
    return await res.json();
  } catch (e) {
    if (e instanceof TypeError) throw new Error("Cannot reach API — is the server running?");
    throw e;
  }
}

const GET    = (path)        => api("GET",    path);
const POST   = (path, body)  => api("POST",   path, body);
const DELETE = (path)        => api("DELETE", path);

function Ic({ k, size=16, sw=2, className="", style={}, fill="none" }) {
  const paths = Array.isArray(P[k]) ? P[k] : [P[k]];
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size}
      viewBox="0 0 24 24" fill={fill} stroke="currentColor"
      strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round"
      className={className} style={style}>
      {paths.map(function(d,i){ return <path key={i} d={d}/>; })}
    </svg>
  );
}

/* ═══════════════════════════════════════════════════════════
   SHARED UI COMPONENTS
═══════════════════════════════════════════════════════════ */
function StatusDot({ running }) {
  return (
    <span style={{ position:"relative", display:"inline-flex", alignItems:"center" }}>
      {running && <span style={{ position:"absolute", inset:0, borderRadius:"50%", background:"#22c55e", animation:"ping 1.4s ease infinite" }}/>}
      <span style={{ width:10, height:10, borderRadius:"50%", background:running?"#22c55e":"#94a3b8", display:"inline-block", position:"relative", boxShadow:running?"0 0 0 2px #dcfce7":"none", transition:"all .3s" }}/>
    </span>
  );
}

function Toast({ msg, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2400); return () => clearTimeout(t); }, []);
  const isErr = msg && msg.toLowerCase().startsWith("error");
  return (
    <div className="toast" style={{ background: isErr ? "#dc2626" : "var(--t1)" }}>
      <Ic k={isErr ? "alert" : "checkCircle"} size={14}/>
      {msg}
    </div>
  );
}

function Modal({ title, onClose, children }) {
  function handleBackdrop(e) { if (e.target === e.currentTarget) onClose(); }
  return (
    <div className="modal-backdrop" onClick={handleBackdrop}>
      <div className="modal">
        <div className="modal-header">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Ic k="xIcon" size={16}/></button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function VarPill({ v }) {
  return <span style={{ display:"inline-flex", alignItems:"center", gap:3, padding:"1px 8px", borderRadius:5, background:"#fef3c7", color:"#92400e", fontSize:".7rem", fontWeight:700, fontFamily:"monospace" }}>{"{{"}{v}{"}}"}</span>;
}

function Spinner({ size=16 }) {
  return <Ic k="refresh" size={size} className="spin"/>;
}

function ApiError({ msg, onRetry }) {
  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:12, padding:"40px 20px", color:"var(--t3)" }}>
      <Ic k="wifiOff" size={28} style={{ opacity:.4 }}/>
      <p style={{ fontSize:".82rem", textAlign:"center", maxWidth:320 }}>{msg}</p>
      {onRetry && <button className="btn-ghost" onClick={onRetry}><Ic k="refresh" size={14}/>Retry</button>}
    </div>
  );
}

function BotControl({ running, onToggle, loading }) {
  const cls = "bot-btn " + (running ? "bot-stop" : "bot-start");
  return (
    <button onClick={onToggle} disabled={loading} className={cls}>
      {loading ? <Spinner size={16}/> : running ? <Ic k="stopSq" size={15} fill="currentColor"/> : <Ic k="play" size={15} fill="currentColor"/>}
      <StatusDot running={running}/>
      <span>{loading ? "Processing…" : running ? "Stop Bot" : "Start Bot"}</span>
    </button>
  );
}

/* ═══════════════════════════════════════════════════════════
   TAB 1 — DASHBOARD
═══════════════════════════════════════════════════════════ */
function StatCard({ iconKey, label, value, sub, accent }) {
  return (
    <div className="stat-card" style={{ "--accent": accent }}>
      <div className="stat-card__icon"><Ic k={iconKey} size={18} sw={2}/></div>
      <div>
        <p className="stat-label">{label}</p>
        <p className="stat-value">{value}</p>
        {sub && <p className="stat-sub">{sub}</p>}
      </div>
    </div>
  );
}

function ConfigPanel({ onToast }) {
  const [cfg, setCfg]       = useState(null);
  const [loading, setLoad]  = useState(true);
  const [apiKey, setApiKey] = useState("");
  const [webhook, setHook]  = useState("");
  const [limit, setLimit]   = useState(50);
  const [showKey, setShowK] = useState(false);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    GET("/config").then(d => {
      const c = d.config;
      setCfg(c);
      setApiKey(c.google_places_api_key || "");
      setHook(c.google_sheets_webhook_url || "");
      setLimit(c.daily_lead_limit || 50);
      setLoad(false);
    }).catch(e => { setLoad(false); onToast("Error loading config: " + e.message); });
  }, []);

  async function doSave() {
    setSaving(true);
    try {
      const body = {};
      if (apiKey && !apiKey.includes("…")) body.google_places_api_key = apiKey;
      if (webhook) body.google_sheets_webhook_url = webhook;
      body.daily_lead_limit = limit;
      const d = await POST("/config", body);
      setCfg(d.config);
      setLimit(d.config.daily_lead_limit);
      onToast("Config saved!");
    } catch(e) {
      onToast("Error: " + e.message);
    } finally {
      setSaving(false);
    }
  }

  if (loading) return <div className="panel" style={{ padding:24, display:"flex", justifyContent:"center" }}><Spinner/></div>;

  return (
    <div className="panel">
      <div className="panel-hdr"><Ic k="settings" size={16}/><h2>Configuration</h2></div>
      <div style={{ padding:"16px 20px", display:"flex", flexDirection:"column", gap:14 }}>
        <div className="field">
          <label className="flabel">Google Places API Key</label>
          <div style={{ display:"flex", gap:6 }}>
            <input type={showKey?"text":"password"} value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="AIzaSy…" className="finput"/>
            <button className="icon-sq" onClick={() => setShowK(s => !s)}><Ic k={showKey?"eyeOff":"eyeOn"} size={15}/></button>
          </div>
        </div>
        <div className="field">
          <label className="flabel">Apps Script Webhook URL</label>
          <input type="text" value={webhook} onChange={e=>setHook(e.target.value)} placeholder="https://script.google.com/macros/…" className="finput"/>
        </div>
        <div className="field">
          <label className="flabel" style={{ display:"flex", justifyContent:"space-between" }}>
            Daily Lead Limit <span className="badge-i">{limit}</span>
          </label>
          <input type="range" min={5} max={500} step={5} value={limit} onChange={e=>setLimit(+e.target.value)} className="fslider"/>
          <div style={{ display:"flex", justifyContent:"space-between", fontSize:".68rem", color:"var(--t3)", fontWeight:600, marginTop:2 }}><span>5</span><span>500</span></div>
        </div>
      </div>
      <div style={{ padding:"0 20px 16px" }}>
        <button className="btn-primary" style={{ width:"100%" }} onClick={doSave} disabled={saving}>
          <Ic k={saving?"refresh":"save"} size={14} className={saving?"spin":""}/>
          {saving ? "Saving…" : "Save Config"}
        </button>
      </div>
    </div>
  );
}

function CityToggle({ activeCity, onSwitch }) {
  return (
    <div className="panel">
      <div className="panel-hdr"><Ic k="pin" size={16}/><h2>Active Location</h2></div>
      <div style={{ padding:"12px 20px", display:"flex", flexWrap:"wrap", gap:7 }}>
        {CITIES.map(city => {
          const short = city.split(",")[0];
          const active = activeCity === city;
          return (
            <button key={city} onClick={() => onSwitch(active ? "" : city)} className={"chip " + (active?"chip-active":"")}>
              <Ic k="globe" size={11}/>{short}
            </button>
          );
        })}
      </div>
      <div style={{ padding:"0 20px 10px", fontSize:".71rem", color:"var(--t3)", display:"flex", alignItems:"center", gap:5 }}>
        <Ic k="info" size={12}/>
        {activeCity ? "Filtering: " + activeCity.split(",")[0] : "All cities active — click to focus"}
      </div>
      {activeCity && <div style={{ padding:"0 20px 14px" }}><button className="btn-ghost" onClick={() => onSwitch("")}>Clear filter</button></div>}
    </div>
  );
}

function LeadTable({ leads, loading, error, onRetry }) {
  const [page, setPage]     = useState(1);
  const [search, setSearch] = useState("");
  const prevQ = useRef(search);
  if (prevQ.current !== search) { prevQ.current = search; if (page !== 1) setPage(1); }

  if (loading) return <div className="panel" style={{ padding:40, display:"flex", justifyContent:"center" }}><Spinner size={22}/></div>;
  if (error)   return <div className="panel"><ApiError msg={error} onRetry={onRetry}/></div>;

  const filtered = leads.filter(l => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (l.name + l.category + l.location + l.phone).toLowerCase().includes(q);
  });
  const total  = filtered.length;
  const pages  = Math.max(1, Math.ceil(total / PAGE_SIZE));
  const start  = (page - 1) * PAGE_SIZE;
  const slice  = filtered.slice(start, start + PAGE_SIZE);
  const lo     = Math.max(1, page - 2);
  const hi     = Math.min(pages, lo + 4);
  const pnums  = [];
  for (let x = lo; x <= hi; x++) pnums.push(x);

  return (
    <div className="panel">
      <div className="panel-hdr">
        <Ic k="list" size={16}/><h2>Leads</h2>
        <span className="badge-i" style={{ marginLeft:4 }}>{fmt(total)}</span>
        <div className="search-box" style={{ marginLeft:"auto" }}>
          <Ic k="search" size={13}/>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search leads…" className="search-input"/>
        </div>
      </div>
      <div style={{ overflowX:"auto" }}>
        {slice.length === 0
          ? <div className="tbl-empty"><Ic k="layers" size={22} style={{ opacity:.3 }}/>No leads found</div>
          : <table className="tbl">
              <thead><tr>
                <th><span><Ic k="tag" size={11}/>Category</span></th>
                <th><span><Ic k="search" size={11}/>Name</span></th>
                <th><span><Ic k="phone" size={11}/>Phone</span></th>
                <th><span><Ic k="pin" size={11}/>City</span></th>
                <th><span><Ic k="clock" size={11}/>Found</span></th>
                <th><span><Ic k="checkCircle" size={11}/>Status</span></th>
              </tr></thead>
              <tbody>{slice.map((lead, idx) => (
                <tr key={lead.place_id || idx} className="trow" style={{ animationDelay:(idx*30)+"ms" }}>
                  <td><span className="cat-tag">{lead.category}</span></td>
                  <td className="name-cell">{lead.name}</td>
                  <td className="mono small">{lead.phone || <span className="t3">N/A</span>}</td>
                  <td className="t3 small">{(lead.location||"").split(",")[0]}</td>
                  <td className="t3 small mono">{lead.discovered_at ? new Date(lead.discovered_at).toLocaleDateString("en-IN",{day:"numeric",month:"short"}) : "—"}</td>
                  <td><span className="status-pill">Qualified</span></td>
                </tr>
              ))}</tbody>
            </table>
        }
      </div>
      {total > PAGE_SIZE && (
        <div className="pagination">
          <span className="t3 small">{start+1}–{Math.min(start+PAGE_SIZE,total)} of {fmt(total)}</span>
          <div style={{ display:"flex", gap:4 }}>
            <button className="pag-btn" disabled={page===1} onClick={()=>setPage(p=>p-1)}><Ic k="chevL" size={13}/></button>
            {pnums.map(n => <button key={n} className={"pag-btn "+(n===page?"pag-active":"")} onClick={()=>setPage(n)}>{n}</button>)}
            <button className="pag-btn" disabled={page===pages} onClick={()=>setPage(p=>p+1)}><Ic k="chevR" size={13}/></button>
          </div>
        </div>
      )}
    </div>
  );
}

function DashboardTab({ running, activeCity, onCitySwitch, onToast }) {
  const [metrics, setMetrics]     = useState(null);
  const [leads, setLeads]         = useState([]);
  const [leadsLoad, setLeadsLoad] = useState(true);
  const [leadsErr, setLeadsErr]   = useState(null);
  const [mLoad, setMLoad]         = useState(true);

  const fetchMetrics = useCallback(() => {
    GET("/metrics").then(d => { setMetrics(d); setMLoad(false); }).catch(e => { setMLoad(false); });
  }, []);

  const fetchLeads = useCallback(() => {
    setLeadsLoad(true); setLeadsErr(null);
    GET("/leads?limit=500").then(d => { setLeads(d.leads || []); setLeadsLoad(false); })
      .catch(e => { setLeadsErr(e.message); setLeadsLoad(false); });
  }, []);

  useEffect(() => {
    fetchMetrics();
    fetchLeads();
    const t = setInterval(fetchMetrics, running ? 5000 : 15000);
    return () => clearInterval(t);
  }, [running]);

  const leadsToday  = metrics?.leads_today  || 0;
  const leadsTotal  = metrics?.leads_total  || 0;
  const callsToday  = metrics?.api_calls_today || 0;
  const dailyLimit  = metrics?.daily_lead_limit || 50;
  const pct         = Math.min(100, Math.round(leadsToday / dailyLimit * 100));
  const filteredLeads = activeCity ? leads.filter(l => l.location === activeCity) : leads;

  return (
    <div>
      <div className="stats-row">
        <StatCard iconKey="trending"   label="Daily Leads"     value={mLoad ? "—" : leadsToday+" / "+dailyLimit} sub={mLoad?"loading…":pct+"% of quota"} accent="#6366f1"/>
        <StatCard iconKey="layers"     label="Total Leads"     value={mLoad ? "—" : fmt(leadsTotal)} sub="all time" accent="#0ea5e9"/>

  async function doSave() {

    setSave(true);
    await onSave({ id: cat?.id, name: name.trim(), emoji, color, active: cat ? cat.active : true });
    setSave(false);
    onClose();
  }

  return (
    <Modal title={isNew ? "Add Category" : "Edit Category"} onClose={onClose}>
      <div style={{ display:"flex", flexDirection:"column", gap:16 }}>

        <div className="field">
          <label className="flabel">Emoji Icon</label>
          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            {EMOJIS.map(em => (
              <button key={em} onClick={()=>setEmoji(em)} style={{ width:36, height:36, borderRadius:9, border:em===emoji?"2px solid var(--indigo)":"1px solid var(--border)", background:em===emoji?"var(--indigo-lt)":"var(--bg)", fontSize:18, cursor:"pointer", transition:"all .15s" }}>{em}</button>

        </div>
        <div className="field">

          <div style={{ display:"flex", flexWrap:"wrap", gap:6 }}>
            {COLORS.map(c => (
              <button key={c} onClick={()=>setColor(c)} style={{ width:28, height:28, borderRadius:"50%", background:c, border:c===color?"3px solid var(--t1)":"2px solid transparent", cursor:"pointer", transition:"all .15s", boxShadow:c===color?"0 0 0 2px white, 0 0 0 4px "+c:"none" }}/>

function CategoriesTab({ onToast }) {
  const [cats, setCats]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError]     = useState(null);
  const [editCat, setEditCat] = useState(null);
  const [showAdd, setShowAdd] = useState(false);
  const [search, setSearch]   = useState("");
  const [syncing, setSyncing] = useState(false);

  const fetchCats = useCallback(() => {
    setLoading(true); setError(null);
    GET("/categories").then(d => { setCats(d.categories || []); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  }, []);

  useEffect(() => { fetchCats(); }, []);

  async function doToggle(cat) {
    try {
      const d = await POST("/categories", { ...cat, active: !cat.active });
      setCats(cs => cs.map(c => c.id === cat.id ? d.category : c));
    } catch(e) { onToast("Error: " + e.message); }
  }

  async function doDelete(id) {
    try {
      await DELETE("/categories/" + id);
      setCats(cs => cs.filter(c => c.id !== id));
      onToast("Category deleted.");
    } catch(e) { onToast("Error: " + e.message); }
  }

  async function doSave(payload) {
    try {
      const d = await POST("/categories", payload);
      const updated = d.category;
      setCats(cs => {
        const exists = cs.some(c => c.id === updated.id);
        if (exists) return cs.map(c => c.id === updated.id ? updated : c);
        return [...cs, updated];
      });
      onToast(payload.id ? "Category updated!" : "Category added!");
    } catch(e) { onToast("Error: " + e.message); }
  }

  async function doSync() {
    setSyncing(true);
    try {
      const d = await POST("/categories/sync");
      onToast(`Synced ${d.business_categories.length} active categories to bot config!`);
    } catch(e) { onToast("Error: " + e.message); }
    finally { setSyncing(false); }
  }

  const filtered   = cats.filter(c => !search || c.name.toLowerCase().includes(search.toLowerCase()));
  const activeCount = cats.filter(c => c.active).length;
  const totalLeads  = cats.reduce((a, c) => a + (c.count || 0), 0);

  return (
    <div>
      <div className="section-topbar">
        <div>
          <h2 className="sec-title">Search Categories</h2>
          <p className="sec-sub">{loading ? "Loading…" : activeCount+" of "+cats.length+" active — bot scrapes these on each run"}</p>
        </div>
        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
          <button className="btn-ghost" onClick={doSync} disabled={syncing} title="Push active categories → config.json (bot uses this list)">
            <Ic k={syncing?"refresh":"sync"} size={14} className={syncing?"spin":""}/>
            {syncing ? "Syncing…" : "Sync to Bot"}
          </button>
          <div className="search-box"><Ic k="search" size={13}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Filter…" className="search-input"/></div>
          <button className="btn-primary" onClick={() => { setEditCat(null); setShowAdd(true); }}><Ic k="plus" size={14}/>Add Category</button>
        </div>
      </div>

      {loading ? (
        <div style={{ display:"flex", justifyContent:"center", padding:60 }}><Spinner size={24}/></div>
      ) : error ? (
        <ApiError msg={error} onRetry={fetchCats}/>
      ) : (
        <>
          <div className="cat-stats-bar">
            <div className="cs-item"><span className="cs-num">{cats.length}</span><span className="t3 small">Total</span></div>
            <div className="cs-div"/>
            <div className="cs-item"><span className="cs-num" style={{color:"#22c55e"}}>{activeCount}</span><span className="t3 small">Active</span></div>
            <div className="cs-div"/>
            <div className="cs-item"><span className="cs-num" style={{color:"#94a3b8"}}>{cats.length - activeCount}</span><span className="t3 small">Paused</span></div>
            <div className="cs-div"/>
            <div className="cs-item"><span className="cs-num">{fmt(totalLeads)}</span><span className="t3 small">Total Leads</span></div>
          </div>

          <div className="cat-grid">
            {filtered.map(cat => (
              <div key={cat.id} className={"cat-card" + (cat.active ? "" : " cat-off")}>
                <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:12 }}>
                  <div style={{ width:42, height:42, borderRadius:10, display:"flex", alignItems:"center", justifyContent:"center", fontSize:20, background:cat.color+"22", border:"1.5px solid "+cat.color+"44", flexShrink:0 }}>{cat.emoji}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:700, fontSize:".9rem", color:"var(--t1)" }}>{cat.name}</div>
                    <div style={{ fontSize:".71rem", color:"var(--t3)", marginTop:2 }}>{fmt(cat.count)} leads found</div>
                  </div>
                  <div style={{ display:"flex", gap:5, flexShrink:0 }}>
                    <button className="icon-sq-sm" onClick={() => { setEditCat(cat); setShowAdd(false); }}><Ic k="edit" size={13}/></button>
                    <button className="icon-sq-sm dang" onClick={() => doDelete(cat.id)}><Ic k="trash" size={13}/></button>
                  </div>
                </div>
                <div style={{ display:"flex", alignItems:"center", gap:8, paddingTop:10, borderTop:"1px solid var(--bs)" }}>
                  <div style={{ width:10, height:10, borderRadius:"50%", background:cat.color, flexShrink:0 }}/>
                  <span className="t3 small">{cat.color}</span>
                  <button className={"tog-btn " + (cat.active ? "tog-on" : "tog-off")} onClick={() => doToggle(cat)}>
                    <span className="tog-knob"/>
                  </button>
                </div>
              </div>
            ))}
            <button className="cat-add-tile" onClick={() => { setEditCat(null); setShowAdd(true); }}>
              <div style={{ width:44, height:44, borderRadius:11, background:"var(--bs)", display:"grid", placeItems:"center" }}><Ic k="plus" size={22}/></div>
              <span>Add Category</span>
            </button>
          </div>
        </>
      )}

      {(showAdd || editCat) && (
        <CatModal cat={editCat} onClose={() => { setShowAdd(false); setEditCat(null); }} onSave={doSave}/>
      )}
    </div>
  );
}

function TplPreview({ tpl, onClose }) {
  const [copied, setCopied] = useState(false);
  const rendered = (() => {
    let b = tpl.body;
    const sub = { name:"Ravi Kumar", business_name:"Ravi Kumar Tailors", category:"tailors", sender_name:"Priya", city:"Hyderabad", phone:"+91 98765 43210" };
    Object.keys(sub).forEach(k => { b = b.split("{{"+k+"}}").join(sub[k]); });
    return b;
  })();
  function doCopy() {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(rendered).then(() => { setCopied(true); setTimeout(()=>setCopied(false),1800); });
    }
  }
  return (
    <Modal title={"Preview — " + tpl.name} onClose={onClose}>
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        {tpl.subject && (
          <div>
            <div className="flabel" style={{ marginBottom:5 }}>Subject Line</div>
            <div style={{ padding:"9px 12px", background:"var(--bg)", borderRadius:9, border:"1px solid var(--border)", fontSize:".82rem", fontWeight:600 }}>{tpl.subject}</div>
          </div>
        )}
        <div>
          <div className="flabel" style={{ marginBottom:5 }}>Message Body</div>
          <pre style={{ padding:14, background:"var(--bg)", borderRadius:9, border:"1px solid var(--border)", fontSize:".8rem", lineHeight:1.65, whiteSpace:"pre-wrap", fontFamily:"'Plus Jakarta Sans',sans-serif", color:"var(--t1)", minHeight:140 }}>{rendered}</pre>
        </div>
        <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>{(tpl.variables||[]).map(v => <VarPill key={v} v={v}/>)}</div>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <span style={{ fontSize:".72rem", color:"var(--t3)" }}>Sent {fmt(tpl.sentCount)} times · {tpl.replyRate}% reply rate</span>
          <button className="btn-primary" onClick={doCopy}>
            <Ic k={copied?"checkCircle":"copy"} size={14}/>{copied ? "Copied!" : "Copy Body"}
          </button>
        </div>
      </div>
    </Modal>
  );
}

function TplEditor({ tpl, onClose, onSave }) {
  const isNew = !tpl;
  const [name,  setName]  = useState(tpl?.name    || "");
  const [tag,   setTag]   = useState(tpl?.tag     || "outreach");
  const [subj,  setSubj]  = useState(tpl?.subject || "");
  const [body,  setBody]  = useState(tpl?.body    || "");
  const [saving, setSave] = useState(false);

  const allText     = body + subj;
  const matches     = allText.match(/\{\{(\w+)\}\}/g) || [];
  const detectedVars = [...new Set(matches)].map(v => v.replace(/[{}]/g, ""));
  function insertVar(v) { setBody(b => b + "{{" + v + "}}"); }

  async function doSave() {
    if (!name.trim() || !body.trim()) return;
    setSave(true);
    await onSave({
      id:        tpl?.id,
      name:      name.trim(),
      tag, subject: subj, body,
      variables: detectedVars,
      sentCount: tpl?.sentCount || 0,
      replyRate: tpl?.replyRate || 0,
      createdAt: tpl?.createdAt || null,
    });
    setSave(false);
    onClose();
  }

  return (
    <Modal title={isNew ? "New Template" : "Edit Template"} onClose={onClose}>
      <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
        <div style={{ display:"grid", gridTemplateColumns:"1fr auto", gap:10 }}>
          <div className="field">
            <label className="flabel">Template Name</label>
            <input className="finput" value={name} onChange={e=>setName(e.target.value)} placeholder="e.g. WhatsApp Intro"/>
          </div>
          <div className="field">
            <label className="flabel">Tag</label>
            <select className="finput" value={tag} onChange={e=>setTag(e.target.value)} style={{ minWidth:110 }}>
              {TAG_OPTS.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
        </div>
        <div className="field">
          <label className="flabel">Subject <span className="t3" style={{ textTransform:"none", fontWeight:400 }}>(optional)</span></label>
          <input className="finput" value={subj} onChange={e=>setSubj(e.target.value)} placeholder="e.g. Quick question for {{business_name}}"/>
        </div>
        <div className="field">
          <label className="flabel" style={{ display:"flex", justifyContent:"space-between" }}>
            <span>Message Body</span>
            <span className="t3 small" style={{ fontWeight:400, textTransform:"none" }}>Use {"{{variable}}"} for personalisation</span>
          </label>
          <textarea className="finput" value={body} onChange={e=>setBody(e.target.value)} rows={7} style={{ resize:"vertical", fontFamily:"inherit", lineHeight:1.6 }} placeholder={"Hi {{name}},\n\nI noticed {{business_name}} doesn't have a website…"}/>
        </div>
        <div className="field">
          <label className="flabel">Quick-insert Variables</label>
          <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
            {["name","business_name","category","sender_name","city","phone"].map(v => (
              <button key={v} onClick={() => insertVar(v)} className="chip" style={{ fontFamily:"monospace", fontSize:".72rem" }}>{"{{"+v+"}}"}</button>
            ))}
          </div>
        </div>
        {detectedVars.length > 0 && (
          <div style={{ display:"flex", gap:5, flexWrap:"wrap", padding:"8px 12px", background:"#fffbeb", borderRadius:8, border:"1px solid #fde68a" }}>
            <span style={{ fontSize:".71rem", color:"#92400e", fontWeight:600, marginRight:4 }}>Detected:</span>
            {detectedVars.map(v => <VarPill key={v} v={v}/>)}
          </div>
        )}
        <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
          <button className="btn-ghost" onClick={onClose}>Cancel</button>
          <button className="btn-primary" onClick={doSave} disabled={!name.trim() || !body.trim() || saving}>
            <Ic k={saving?"refresh":"save"} size={14} className={saving?"spin":""}/>{saving?"Saving…":isNew?"Create Template":"Save Changes"}
          </button>
        </div>
      </div>
    </Modal>
  );
}

function TemplatesTab({ onToast }) {
  const [templates, setTemplates] = useState([]);
  const [loading, setLoading]     = useState(true);
  const [error, setError]         = useState(null);
  const [editing, setEditing]     = useState(null);
  const [showNew, setShowNew]     = useState(false);
  const [previewing, setPreview]  = useState(null);
  const [filter, setFilter]       = useState("all");
  const [search, setSearch]       = useState("");

  const fetchTpls = useCallback(() => {
    setLoading(true); setError(null);
    GET("/templates").then(d => { setTemplates(d.templates || []); setLoading(false); })
      .catch(e => { setError(e.message); setLoading(false); });
  }, []);

  useEffect(() => { fetchTpls(); }, []);

  async function doDelete(id) {
    try {
      await DELETE("/templates/" + id);
      setTemplates(ts => ts.filter(t => t.id !== id));
      onToast("Template deleted.");
    } catch(e) { onToast("Error: " + e.message); }
  }

  async function doSave(payload) {
    try {
      const d = await POST("/templates", payload);
      const updated = d.template;
      setTemplates(ts => {
        const exists = ts.some(t => t.id === updated.id);
        if (exists) return ts.map(t => t.id === updated.id ? updated : t);
        return [...ts, updated];
      });
      onToast(payload.id ? "Template updated!" : "Template created!");
    } catch(e) { onToast("Error: " + e.message); }
  }

  const usedTags = TAG_OPTS.filter(t => templates.some(tp => tp.tag === t));
  const tags     = ["all", ...usedTags];
  const visible  = templates.filter(t => {
    const matchTag = filter === "all" || t.tag === filter;
    const q = search.toLowerCase();
    const matchQ = !search || t.name.toLowerCase().includes(q) || t.body.toLowerCase().includes(q);
    return matchTag && matchQ;
  });
  const avgReply = templates.length ? Math.round(templates.reduce((a,t) => a + (t.replyRate||0), 0) / templates.length) : 0;

  return (
    <div>
      <div className="section-topbar">

          <h2 className="sec-title">DM Templates</h2>
          <p className="sec-sub">{loading ? "Loading…" : templates.length+" templates · avg "+avgReply+"% reply rate"}</p>
        </div>
        <div style={{ display:"flex", gap:10, alignItems:"center", flexWrap:"wrap" }}>
          <div className="search-box"><Ic k="search" size={13}/><input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search templates…" className="search-input"/></div>
          <button className="btn-primary" onClick={() => { setEditing(null); setShowNew(true); }}><Ic k="plus" size={14}/>New Template</button>
        </div>
      </div>

      {!loading && !error && (
        <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:20 }}>
          {tags.map(t => {
            const c = t === "all" ? "#5B67F8" : (TAG_CLR[t] || "#5B67F8");
            const isActive = filter === t;
            return (
              <button key={t} onClick={() => setFilter(t)} style={{ padding:"5px 14px", borderRadius:99, fontSize:".75rem", fontWeight:700, fontFamily:"inherit", cursor:"pointer", transition:"all .15s", background:isActive?c:"var(--surface)", color:isActive?"#fff":"var(--t2)", border:isActive?"1.5px solid "+c:"1.5px solid var(--border)", boxShadow:isActive?"0 2px 8px "+c+"44":"none" }}>
                {t === "all" ? "All Templates" : t}
                {t !== "all" && <span style={{ marginLeft:5, opacity:.7, fontSize:".68rem" }}>({templates.filter(tp=>tp.tag===t).length})</span>}
              </button>
            );
          })}
        </div>
      )}

      {loading ? (
        <div style={{ display:"flex", justifyContent:"center", padding:60 }}><Spinner size={24}/></div>
      ) : error ? (
        <ApiError msg={error} onRetry={fetchTpls}/>
      ) : visible.length === 0 ? (
        <div className="tbl-empty" style={{ background:"var(--surface)", borderRadius:"var(--r)", border:"1px solid var(--border)", padding:48 }}>
          <Ic k="msg" size={28} style={{opacity:.2}}/>No templates match
        </div>
      ) : (
        <div className="tpl-grid">
          {visible.map(tpl => {
            const tc = TAG_CLR[tpl.tag] || "#5B67F8";
            return (
              <div key={tpl.id} className="tpl-card">
                <div style={{ display:"flex", alignItems:"flex-start", gap:10, marginBottom:8 }}>

                    <div style={{ fontWeight:700, fontSize:".88rem", color:"var(--t1)", marginBottom:4, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{tpl.name}</div>

                  <div style={{ display:"flex", gap:5, flexShrink:0 }}>
                    <button className="icon-sq-sm" onClick={() => setPreview(tpl)} title="Preview"><Ic k="eyeOn" size={13}/></button>

      <div style={{ background:"var(--surface)", border:"1.5px solid var(--border)", borderRadius:"var(--r)", padding:"18px 20px", boxShadow:"var(--sh)", marginTop:8 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:10 }}>
          <Ic k="info" size={15} style={{color:"var(--indigo)"}}/>
          <span style={{ fontWeight:700, fontSize:".82rem" }}>Available Variables</span>
        </div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
          {[["name","Contact name"],["business_name","Business name"],["category","Business type"],["sender_name","Your name"],["city","Lead city"],["phone","Phone number"]].map(pair => (
            <div key={pair[0]} style={{ display:"flex", flexDirection:"column", gap:3 }}>
              <VarPill v={pair[0]}/>
              <span style={{ fontSize:".65rem", color:"var(--t3)", paddingLeft:2 }}>{pair[1]}</span>
            </div>
          ))}
        </div>
      </div>

      {(showNew || editing) && <TplEditor tpl={editing} onClose={() => { setShowNew(false); setEditing(null); }} onSave={doSave}/>}
      {previewing && <TplPreview tpl={previewing} onClose={() => setPreview(null)}/>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════ */
const TABS = [
  { key:"dashboard",  label:"Dashboard",    icon:"bar"  },
  { key:"categories", label:"Categories",   icon:"grid" },
  { key:"templates",  label:"DM Templates", icon:"msg"  },
];

function App() {
  const [tab, setTab]           = useState("dashboard");
  const [running, setRunning]   = useState(false);
  const [botLoad, setBotLoad]   = useState(false);
  const [activeCity, setACity]  = useState("");
  const [toastMsg, setToastMsg] = useState(null);
  const [apiOk, setApiOk]       = useState(true);

  function toast(msg) { setToastMsg(null); setTimeout(() => setToastMsg(msg), 10); }

  // Poll bot running state from /metrics every 5s
  useEffect(() => {
    let alive = true;
    async function poll() {
      try {
        const d = await GET("/metrics");
        if (!alive) return;
        setRunning(d.bot_running || false);
        setACity(d.active_city === "ALL" ? "" : (d.active_city || ""));
        setApiOk(true);
      } catch(e) {
        if (alive) setApiOk(false);
      }
    }
    poll();
    const t = setInterval(poll, running ? 5000 : 10000);
    return () => { alive = false; clearInterval(t); };
  }, [running]);

  async function handleBotToggle() {
    setBotLoad(true);
    try {
      if (running) {
        await POST("/bot/stop");
        toast("Stop requested — finishing current pair…");
        setRunning(false);
      } else {
        await POST("/bot/run");
        toast("Bot started!");
        setRunning(true);
      }
    } catch(e) {
      toast("Error: " + e.message);
    } finally {
      setBotLoad(false);
    }
  }

  async function handleCitySwitch(city) {
    setACity(city);
    try {
      await POST("/active-city", { city });
    } catch(e) {
      toast("Error: " + e.message);
    }
  }

  return (
    <div className="app">
      <style>{CSS}</style>

      {!apiOk && (
        <div style={{ background:"#fef2f2", borderBottom:"1px solid #fecaca", padding:"8px 24px", display:"flex", alignItems:"center", gap:8, fontSize:".78rem", color:"#991b1b", fontWeight:600 }}>
          <Ic k="wifiOff" size={14}/>
          Cannot reach API at <code style={{ background:"#fee2e2", padding:"0 6px", borderRadius:4 }}>{API_BASE}</code> — start the FastAPI server to connect live data.
        </div>
      )}

      <header className="app-hdr">
        <div style={{ display:"flex", alignItems:"center", gap:12 }}>
          <div className="brand-icon"><Ic k="activity" size={18} sw={2.5}/></div>
          <div>
            <div className="brand-name">LeadRadar</div>
            <div className="brand-sub">Local Business Intelligence</div>
          </div>
        </div>
        <nav className="tab-nav">
          {TABS.map(t => (
            <button key={t.key} onClick={() => setTab(t.key)} className={"tab-btn " + (tab===t.key?"tab-active":"")}>
              <Ic k={t.icon} size={14}/><span>{t.label}</span>
            </button>
          ))}
        </nav>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span className="ref-hint">
            <span style={{ width:7, height:7, borderRadius:"50%", background: apiOk ? "#22c55e" : "#ef4444", display:"inline-block" }}/>
            {apiOk ? "Live" : "Offline"}
          </span>
          <BotControl running={running} onToggle={handleBotToggle} loading={botLoad}/>
        </div>
      </header>

      <main style={{ paddingTop:4 }}>
        {tab === "dashboard"  && <DashboardTab running={running} activeCity={activeCity} onCitySwitch={handleCitySwitch} onToast={toast}/>}
        {tab === "categories" && <CategoriesTab onToast={toast}/>}
        {tab === "templates"  && <TemplatesTab  onToast={toast}/>}
      </main>

      {toastMsg && <Toast msg={toastMsg} onDone={() => setToastMsg(null)}/>}
    </div>
  );
}
